    ctx.beginPath();

    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = lineWidth;
    ctx.lineCap = 'square';

  function randomTapSlots(count, totalMs) {

    var span = maxFrac - minFrac;
    var fracs = [];
    for (var i = 0; i < count; i++) fracs.push(Math.random());
    fracs.sort(function (a, b) { return a - b; });

    var minGap = count > 1 ? span / (count * 1.8) : 0;
    var points = fracs.map(function (f) { return minFrac + f * span; });
    for (var j = 1; j < points.length; j++) {

    // if enforcing gaps pushed the last point past maxFrac, shift all back

    if (overshoot > 0) {

    // increasing order with a minimum gap so taps never bunch up, and
    // capped before RUN_MS so the last tap (not the clock) ends the phase.
    var tapSlots = randomTapSlots(cycle.count, RUN_MS);

    var finished = false;
    var timers = [];

    // Mirrors the real app: the clock doesn't count down independently
    // of taps. Each task has a fixed time budget (totalSeconds / count).
    // Completing a task snaps the remaining time straight to that
    // task's scheduled boundary (totalSeconds - completedCount * budget)
    // - never backward - and the countdown continues from there at the
    // same steady rate. Tapping "early" jumps the clock forward in time;
    // the clock never runs independently of task completion.
    var rate = totalSeconds / RUN_MS; // virtual seconds per real ms
    var baselineSeconds = totalSeconds;
    var baselineRealMs = 0;

      return Math.max(0, val);

        timers.forEach(clearTimeout);

        clockEl.textContent = fmtClock(0);

          // Never snap backward/up - only jump the clock forward to the
          // scheduled boundary if it hasn't already passed that point.
          baselineSeconds = Math.min(displaySecondsAt(elapsedReal), nominalBoundary);
          baselineRealMs = elapsedReal;

          drawRing(canvas, totalSeconds > 0 ? baselineSeconds / totalSeconds : 0);
          clockEl.textContent = fmtClock(baselineSeconds);

          ripple(pane, randPct(20, 80), randPct(30, 70));
          counterEl.textContent = completed + '/' + cycle.count;
          counterEl.classList.add('pulse');
          setTimeout(function () { counterEl.classList.remove('pulse'); }, 220);

          // All tasks done - the timer stops right here, not when
          // RUN_MS naturally runs out.
          if (completed >= cycle.count) {
            timers.push(setTimeout(finish, 320));
          }
        }, t);
        timers.push(id);
      });

      function frame(now) {
        if (finished) return;
        var elapsed = now - start;
        var seconds = displaySecondsAt(elapsed);
        drawRing(canvas, totalSeconds > 0 ? seconds / totalSeconds : 0);
        clockEl.textContent = fmtClock(seconds);
        if (elapsed < RUN_MS && seconds > 0) {
          requestAnimationFrame(frame);
        } else {
          finish();
        }
      }
      requestAnimationFrame(frame);
    });
  }

  async function playCycle(cycle) {
    // home
    var pane = transitionTo(homeHTML());
    drawRing(pane.querySelector('.ring-canvas'), 1);
    await sleep(1500);

    ripple(pane, 50, 74);
    pane.querySelector('#homeStart').classList.add('tapped');
    await sleep(280);

    // setup
    pane = transitionTo(setupHTML());
    await sleep(200);

    var kb = showKeyboard(pane, 'qwerty');
    await sleep(220);
    await typeText(pane.querySelector('#f-task'), cycle.task, 105, function (ch) {
      flashKey(kb, ch);
    });
    await sleep(260);

    kb = showKeyboard(pane, 'numeric');
    await sleep(180);
    await typeText(pane.querySelector('#f-min'), String(cycle.minutes), 140, function (ch) {
      flashKey(kb, ch);
    });
    await sleep(200);
    await typeText(pane.querySelector('#f-count'), String(cycle.count), 140, function (ch) {
      flashKey(kb, ch);
    });
    await sleep(220);

    hideKeyboard(pane);
    await sleep(240);

    ripple(pane, 50, 78);
    pane.querySelector('#setupStart').classList.add('tapped');
    await sleep(280);

    // running
    pane = transitionTo(runningHTML());
    await runTimerPhase(pane, cycle);

    // done
    pane = transitionTo(doneHTML());
    await sleep(1400);

    // back home
    pane = transitionTo(homeHTML());
    drawRing(pane.querySelector('.ring-canvas'), 1);
    await sleep(550);

    // triple tap blank space -> history
    ripple(pane, 50, 46); await sleep(150);
    ripple(pane, 50, 46); await sleep(150);
    ripple(pane, 50, 46);
    await sleep(320);

    history.unshift({ task: cycle.task, minutes: cycle.minutes, count: cycle.count });
    if (history.length > 6) history.length = 6;

    pane = transitionTo(historyHTML(history));
    await sleep(3600);

    // back home before next cycle
    pane = transitionTo(homeHTML());
    drawRing(pane.querySelector('.ring-canvas'), 1);
    await sleep(500);
  }

  async function engine() {
    var lastIndex = -1;
    while (true) {
      var idx;
      do { idx = Math.floor(Math.random() * CYCLES.length); } while (idx === lastIndex && CYCLES.length > 1);
      lastIndex = idx;
      await playCycle(CYCLES[idx]);
    }
  }

  if (reduced) {
    var pane = transitionTo(homeHTML());
    drawRing(pane.querySelector('.ring-canvas'), 1);
  } else {
    engine();
  }
})();
</script>
