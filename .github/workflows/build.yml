name: Build Production APK

on:
  push:
    branches: [ main, master ] # Triggers whenever you push code here
  workflow_dispatch: # Allows you to trigger the build manually

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: Grant Execute Permission to Gradle
      run: chmod +x ./gradlew

    - name: Build Optimized Release APK
      run: ./gradlew assembleRelease

    - name: Upload Final APK Asset
      uses: actions/upload-artifact@v4
      with:
        name: flow-state-timer-release
        path: app/build/outputs/apk/release/app-release-unsigned.apk
