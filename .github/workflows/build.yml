name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Decode debug keystore
        run: base64 -d debug.keystore.base64 > debug.keystore

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Always produce a debug APK, signed with the checked-in debug key.
      - name: Build debug APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log

      # The Actions log UI isn't reachable from Claude's sandbox, so on
      # failure, post the tail of the build log as a repo issue instead,
      # which is readable via the GitHub REST API.
      - name: Report build log on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tail -c 55000 build.log > build.log.trunc || true
          python3 - <<'PYEOF'
          import json, os, urllib.request
          with open("build.log.trunc") as f:
              log = f.read()
          body = "```\n" + log + "\n```"
          payload = json.dumps({"title": "CI build failure", "body": body}).encode()
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues",
              data=payload, method="POST"
          )
          req.add_header("Authorization", f"token {os.environ['GH_TOKEN']}")
          req.add_header("Accept", "application/vnd.github+json")
          urllib.request.urlopen(req)
          PYEOF

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      # Detect whether a release keystore has been configured, without
      # referencing the `secrets` context inside an `if:` expression
      # (not supported there) - write the result to a step output instead.
      - name: Detect release keystore
        id: detect
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "has_release_keystore=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_release_keystore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode release keystore
        if: steps.detect.outputs.has_release_keystore == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > my-upload-key.jks


      - name: Build release APK
        if: steps.detect.outputs.has_release_keystore == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee release-build.log

      - name: List actual release output files
        if: steps.detect.outputs.has_release_keystore == 'true'
        run: find app/build/outputs -type f | tee release-outputs.txt

      - name: Report release output listing
        if: steps.detect.outputs.has_release_keystore == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request
          with open("release-outputs.txt") as f:
              log = f.read()
          body = "```\n" + log + "\n```"
          payload = json.dumps({"title": "CI release output listing", "body": body}).encode()
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues",
              data=payload, method="POST"
          )
          req.add_header("Authorization", f"token {os.environ['GH_TOKEN']}")
          req.add_header("Accept", "application/vnd.github+json")
          urllib.request.urlopen(req)
          PYEOF

      - name: Report release build log on failure
        if: failure() && steps.detect.outputs.has_release_keystore == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tail -c 55000 release-build.log > release-build.log.trunc || true
          python3 - <<'PYEOF'
          import json, os, urllib.request
          with open("release-build.log.trunc") as f:
              log = f.read()
          body = "```\n" + log + "\n```"
          payload = json.dumps({"title": "CI release build failure", "body": body}).encode()
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues",
              data=payload, method="POST"
          )
          req.add_header("Authorization", f"token {os.environ['GH_TOKEN']}")
          req.add_header("Accept", "application/vnd.github+json")
          urllib.request.urlopen(req)
          PYEOF

      - name: Upload release APK
        if: steps.detect.outputs.has_release_keystore == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk

      # When a version tag (v1.0.0 etc.) is pushed, attach the signed APK
      # directly to a GitHub Release - runs on GitHub's runner, so it isn't
      # limited by artifact-download restrictions elsewhere.
      - name: Create GitHub Release with APK
        if: startsWith(github.ref, 'refs/tags/v') && steps.detect.outputs.has_release_keystore == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          gh release create "${{ github.ref_name }}" \
            app/build/outputs/apk/release/app-release.apk \
            --title "FlowTimer ${{ github.ref_name }}" \
            --notes "Automated signed release build." > release-create.log 2>&1
          cat release-create.log

      - name: Report release-creation log on failure
        if: failure() && startsWith(github.ref, 'refs/tags/v') && steps.detect.outputs.has_release_keystore == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request
          try:
              with open("release-create.log") as f:
                  log = f.read()
          except FileNotFoundError:
              log = "(no release-create.log found)"
          body = "```\n" + log + "\n```"
          payload = json.dumps({"title": "CI release-creation failure", "body": body}).encode()
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues",
              data=payload, method="POST"
          )
          req.add_header("Authorization", f"token {os.environ['GH_TOKEN']}")
          req.add_header("Accept", "application/vnd.github+json")
          urllib.request.urlopen(req)
          PYEOF
